name: MATLAB CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  matlab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Start virtual display server
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: latest
          cache: true

      - name: Run numerical DSP tests
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); ok=run_all_tests(); assert(ok); [x,fs]=generate_demo_audio(''); assert(fs==16000); assert(numel(x)==64000); [S,f,t]=frame_spectrogram(x,fs,30,0.75); assert(~isempty(S)&&all(isfinite(S(:)))); [yn,~]=add_demo_noise(x,fs,'tone',0.35,1000); b=design_fir_filter('bandstop',fs,200,900,1100); yf=apply_fir_filter(yn,b); assert(numel(yf)==numel(x)); [yr,d]=apply_voice_preset(x,fs,'robot'); assert(numel(yr)==numel(x)); assert(~isempty(d));

      - name: Exercise GUI classroom workflow
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); test_gui_workflow();

      - name: Verify workflow against user manual
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); test_user_manual_acceptance();

      - name: Verify v0.4 regressions
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); test_v04_regressions();

      - name: Verify v0.5 classroom presentation regressions
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(genpath(pwd)); test_builtin_audio_loader(); test_v05_regressions();

      - name: Package tested MATLAB source
        run: zip -r matlab-tested-source.zip main.m app modules tests README.md docs

      - name: Upload tested source artifact
        uses: actions/upload-artifact@v4
        with:
          name: matlab-tested-source
          path: matlab-tested-source.zip
          if-no-files-found: error
